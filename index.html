<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة معمل العلوم التفاعلية</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        :root { --blue: #00f3ff; --purple: #bc13fe; --bg: #05070a; --green: #39ff14; --pink: #ff0055; }
        
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            background: var(--bg); color: #fff; 
            font-family: 'Cairo', sans-serif; 
            overflow-x: hidden; 
            display: flex; flex-direction: column; width: 100%;
        }

        .space-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1b2735 0%, #05070a 100%); }
        
        .school-header { position: relative; text-align: center; padding: 15px; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); border-bottom: 2px solid var(--blue); z-index: 1500; width: 100%; }
        .glowing-title { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 15px var(--blue); font-size: 1.2rem; margin: 0; }

        .dashboard-bar { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 10px; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(0, 243, 255, 0.2); flex-wrap: wrap; width: 100%; }
        .stat-item { background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 15px; border: 1px solid var(--blue); display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #fff; }
        
        .blink-stat { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }

        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }

        .main-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; z-index: 5; padding: 20px; width: 100%; }
        
        .card { 
            background: rgba(10, 15, 25, 0.85); backdrop-filter: blur(25px); 
            padding: 40px 20px; border-radius: 35px; border: 2px solid var(--blue); 
            text-align: center; width: 100%; max-width: 450px; 
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.2); 
            margin: auto; display: flex; flex-direction: column; align-items: center;
            position: relative;
        }

        .card-refresh-btn {
            position: absolute; top: 15px; left: 15px;
            background: rgba(255,255,255,0.1); border: 1px solid var(--blue);
            color: #fff; padding: 5px 10px; border-radius: 8px;
            cursor: pointer; font-size: 12px; z-index: 10;
        }

        .input-style { 
            width: 90%; padding: 14px; border-radius: 12px; border: 2px solid var(--blue); 
            background: rgba(0,0,0,0.6); color: #fff; text-align: center; 
            font-size: 1rem; margin-bottom: 15px; outline: none; 
        }

        .btn { background: var(--purple); color: #fff; border: none; padding: 14px 20px; border-radius: 15px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 1.1rem; width: 90%; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { background: var(--blue); color: #000; box-shadow: 0 0 20px var(--blue); }
        
        .alert-icon { 
            display: inline-block;
            color: #ffff00; 
            font-weight: bold;
            animation: mobile-blink 0.8s ease-in-out infinite; 
        }
        @keyframes mobile-blink { 
            0% { opacity: 1; } 
            50% { opacity: 0.1; } 
            100% { opacity: 1; } 
        }

        .option { background: rgba(255,255,255,0.05); padding: 12px; margin: 8px 0; border-radius: 15px; cursor: pointer; text-align: right; border: 1px solid rgba(0,243,255,0.2); width: 100%; transition: 0.2s; font-size: 0.95rem; }
        .correct { background: var(--green) !important; color: #000 !important; font-weight: bold; }
        .wrong { background: var(--pink) !important; color: #fff !important; }

        .q-image { max-width: 100%; max-height: 200px; border-radius: 15px; margin-bottom: 15px; border: 2px solid var(--blue); display: none; margin-inline: auto; }
        #report-capture { position: absolute; left: -9999px; top: 0; width: 700px; background: #05070a; padding: 50px; color: white; border: 8px solid var(--blue); border-radius: 20px; }
        
        #quiz-area, #tabs-container, #result-screen { display: none; width: 100%; }
        @media (max-width: 600px) { .card { width: 95%; padding: 25px 15px; } }
    </style>
</head>
<body>

<div class="space-bg"></div>

<div class="school-header">
    <h2 id="ui-school-name" class="glowing-title">جاري تحميل المختبر...</h2>
    <p style="margin:5px 0; font-size: 0.9rem;">
        <span id="ui-manager-name" style="color:var(--blue)">...</span> | 
        <span id="ui-teacher-name" style="color:var(--green)">...</span>
    </p>
</div>

<div id="dashboard" class="dashboard-bar">
    <div class="stat-item">
        <span id="status-dot" class="status-dot"></span>
        <span>متصل</span>
    </div>
    <div class="stat-item blink-stat">
        <span>نتائج مرسلة:</span>
        <span id="v-count" style="color:var(--blue); font-family:'Orbitron'">0000</span>
    </div>
    <div class="stat-item blink-stat">
        <span>المتواجدون:</span>
        <span id="active-count" style="color:var(--green); font-family:'Orbitron'">1</span>
    </div>
</div>

<div class="main-wrapper">
    <div id="login-screen" class="card">
        <button class="card-refresh-btn" onclick="location.reload()">🔄 تحديث</button>
        <h1 id="platform-title" class="glowing-title" style="font-size: 1.8rem; margin-top: 20px; margin-bottom: 20px;">SCIENCE LAB</h1>
        <input type="text" id="stdName" class="input-style" placeholder="أدخل اسمك يا بطل">
        <select id="stdLevel" class="input-style">
            <option value="" disabled selected>اختر صفك الدراسي</option>
            <option value="سادس أ">سادس أ</option>
            <option value="سادس ب">سادس ب</option>
            <option value="اول متوسط">اول متوسط</option>
            <option value="ثاني متوسط">ثاني متوسط</option>
        </select>
        <button class="btn" onclick="startApp()">انطلق للمختبر 🚀</button>
    </div>

    <div id="tabs-container" class="card">
        <button class="card-refresh-btn" onclick="location.reload()">🔄 تحديث</button>
        <h3 id="welcome-msg" style="color: var(--blue); margin-top: 30px; margin-bottom: 25px;"></h3>
        <div id="tabs" style="display:grid; grid-template-columns: 1fr; gap:12px; width:100%;"></div>
    </div>

    <div id="quiz-area" class="card">
        <button class="card-refresh-btn" onclick="location.reload()">🔄 تحديث</button>
        <div style="display:flex; justify-content: space-between; width:100%; margin-top: 30px; margin-bottom: 15px;">
            <span id="timerText" style="color:var(--pink); font-family: 'Orbitron'; font-weight: bold; display:none;">30s</span>
            <span id="qCounter" style="color:var(--blue); font-weight: bold;"></span>
        </div>
        <img id="questionImg" class="q-image" alt="Question">
        <h3 id="qText" style="margin-bottom: 20px; line-height: 1.5;"></h3>
        <div id="optionsContainer" style="width:100%;"></div>
    </div>

    <div id="result-screen" class="card">
        <button class="card-refresh-btn" onclick="location.reload()">🔄 تحديث</button>
        <h2 style="color: var(--green); margin-top: 30px; margin-bottom: 10px;">تم الإنجاز بنجاح!</h2>
        <h3 id="finalName" style="color: #fff;"></h3>
        <div id="finalScore" style="font-size:2.5rem; color:var(--blue); font-family: 'Orbitron'; margin: 15px 0;"></div>
        <p id="detailedStats" style="font-size: 1rem; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 12px;"></p>
        <div style="display:grid; grid-template-columns: 1fr; gap:10px; margin-top:20px; width:100%;">
            <button id="submitBtn" class="btn" onclick="sendResult()">
                <span class="alert-icon">⚠️</span> 📩 إرسال النتيجة للمعلم
            </button>
            <button class="btn" style="background:#444" onclick="generateReportImage()">📸 حفظ التقرير</button>
            <button class="btn" style="background:#25D366" onclick="sendWhatsApp()">💬 واتساب المعلم</button>
        </div>
    </div>
</div>

<div id="report-capture">
    <div style="text-align:center; border-bottom: 3px solid var(--blue); padding-bottom: 30px;">
        <h1 style="color:var(--blue); font-size: 35px;">تقرير مختبر العلوم</h1>
        <h2 id="rep-school"></h2>
        <div style="font-size: 20px;">الطالب: <span id="rep-name" style="color:var(--green)"></span> | الصف: <span id="rep-level"></span></div>
        <h2 id="rep-score" style="font-family: Orbitron; font-size: 40px; color: var(--blue);"></h2>
    </div>
    <div id="rep-questions-list" style="margin-top:30px;"></div>
</div>

<audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>
<audio id="sound-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<script>
    const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQoDltg5gz2B-6xfejx4s0Rm-EtYaWjwGII5P8Wk4OEh-o3dpYBy9V_2udC1SLD89tSQFFD88Pqd0Ms/pub?gid=0&single=true&output=csv';
    const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSd6qV0wUZIOTA3maN-KuBBhzivjeF0lCYD37-Ecr4FErVu6Xw/formResponse';

    let allData = [], studentName = "", studentLevel = "", correctCount = 0, wrongCount = 0, totalQs = 0, currentLab = "";
    let teacherName = "", managerName = "", schoolName = "", teacherPhone = "";
    let userAnswers = [];

    window.onload = () => {
        fetchData();
        setInterval(() => {
            document.getElementById('active-count').innerText = Math.floor(Math.random() * 5) + 1;
        }, 8000);
    };

    function fetchData() {
        Papa.parse(SHEET_CSV, { 
            download: true, header: true, 
            complete: (res) => {
                allData = res.data;
                if(allData.length > 0) {
                    schoolName = allData[0]['المدرسة'] || "المعمل العلمي";
                    managerName = allData[0]['المدير'] || "...";
                    teacherName = allData[0]['المعلم'] || "...";
                    teacherPhone = allData[0]['الهاتف'] || "";
                    
                    // تحديث العنوان من خانة "المنصة" إذا كانت موجودة
                    if(allData[0]['المنصة']) {
                        document.getElementById('platform-title').innerText = allData[0]['المنصة'];
                    }

                    let countValue = allData[0]['العداد'] || 0;
                    document.getElementById('v-count').innerText = countValue.toString().padStart(4, '0');
                    document.getElementById('ui-school-name').innerText = schoolName;
                    document.getElementById('ui-manager-name').innerText = "المدير: " + managerName;
                    document.getElementById('ui-teacher-name').innerText = "المعلم: " + teacherName;
                    
                    // التحميل المسبق للصور لضمان السرعة
                    preloadImages(allData);
                }
            }
        });
    }

    // دالة التحميل المسبق للصور
    function preloadImages(data) {
        data.forEach(item => {
            if(item['الصورة'] && item['الصورة'].trim() !== "") {
                const img = new Image();
                img.src = item['الصورة'];
            }
        });
    }

    function startApp() {
        studentName = document.getElementById('stdName').value;
        studentLevel = document.getElementById('stdLevel').value;
        if(!studentName || !studentLevel) return alert("سجل بياناتك أولاً!");
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('tabs-container').style.display = 'block';
        document.getElementById('welcome-msg').innerText = `أهلاً بك يا ${studentName}`;
        renderLabs();
    }

    function renderLabs() {
        let lookup = (studentLevel.includes("سادس")) ? "سادس" : studentLevel;
        const labs = [...new Set(allData.filter(q => q['الصف'] && q['الصف'].trim() === lookup).map(q => q['المختبر'].trim()))];
        const div = document.getElementById('tabs'); div.innerHTML = "";
        labs.forEach(l => {
            div.innerHTML += `<button class="btn" style="background:rgba(255,255,255,0.05); border:1px solid var(--blue);" onclick="startQuiz('${l}')">${l}</button>`;
        });
    }

    function startQuiz(lab) {
        currentLab = lab; correctCount = 0; wrongCount = 0; userAnswers = [];
        const lookup = (studentLevel.includes("سادس")) ? "سادس" : studentLevel;
        const qs = allData.filter(q => q['المختبر'] === currentLab && q['الصف'] === lookup && q['السؤال']);
        const realQs = qs.filter(q => q['الإجابة الصحيحة'] !== 'استمر' && q['الإجابة الصحيحة'] !== 'ابدأ الاختبار');
        totalQs = realQs.length;
        document.getElementById('tabs-container').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        loadQuestion(0);
    }

    function loadQuestion(idx) {
        const lookup = (studentLevel.includes("سادس")) ? "سادس" : studentLevel;
        const qs = allData.filter(q => q['المختبر'] === currentLab && q['الصف'] === lookup && q['السؤال']);
        if(idx >= qs.length) return showResult();
        
        const q = qs[idx];
        const isEducational = (q['الإجابة الصحيحة'] === 'استمر' || q['الإجابة الصحيحة'] === 'ابدأ الاختبار');
        
        if(isEducational) {
            document.getElementById('qCounter').innerText = "مرحلة الشرح";
        } else {
            const currentRealIdx = qs.slice(0, idx+1).filter(item => item['الإجابة الصحيحة'] !== 'استمر' && item['الإجابة الصحيحة'] !== 'ابدأ الاختبار').length;
            document.getElementById('qCounter').innerText = `${currentRealIdx} / ${totalQs}`;
        }

        document.getElementById('qText').innerText = q['السؤال'];
        const imgEl = document.getElementById('questionImg');
        if(q['الصورة']) { imgEl.src = q['الصورة']; imgEl.style.display = 'block'; } else { imgEl.style.display = 'none'; }
        
        let wrongAnswersArray = q['إجابة خاطئة'] ? q['إجابة خاطئة'].split(/,|،/).map(item => item.trim()).filter(i => i !== "") : [];
        let opts = [q['الإجابة الصحيحة'], ...wrongAnswersArray];
        if(!isEducational) opts = opts.slice(0, 4).sort(() => Math.random() - 0.5); 
        
        const container = document.getElementById('optionsContainer'); container.innerHTML = "";
        opts.forEach(o => {
            const div = document.createElement('div'); div.className = 'option'; div.innerText = o;
            div.onclick = () => {
                if(o === 'السابق' && idx > 0) return loadQuestion(idx - 1);
                
                const isCorrect = (o === q['الإجابة الصحيحة']);
                
                if(!isEducational) {
                    userAnswers.push({ q: q['السؤال'], user: o, correct: q['الإجابة الصحيحة'], status: isCorrect });
                    if(isCorrect) { correctCount++; document.getElementById('sound-correct').play(); } 
                    else { wrongCount++; document.getElementById('sound-wrong').play(); }
                }

                const allOptions = container.querySelectorAll('.option');
                allOptions.forEach(opt => opt.style.pointerEvents = 'none');
                div.classList.add(isCorrect ? 'correct' : 'wrong');
                if(!isCorrect && !isEducational) {
                    allOptions.forEach(opt => { if(opt.innerText === q['الإجابة الصحيحة']) opt.classList.add('correct'); });
                }
                
                setTimeout(() => loadQuestion(idx+1), 800);
            };
            container.appendChild(div);
        });
    }

    function showResult() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('sound-win').play();
        document.getElementById('finalName').innerText = studentName;
        document.getElementById('finalScore').innerText = `الدرجة: ${correctCount} من ${totalQs}`;
        document.getElementById('detailedStats').innerText = `✅ صحيحة: ${correctCount} | ❌ خاطئة: ${wrongCount}`;
    }

    async function sendResult() {
        const sBtn = document.getElementById('submitBtn');
        sBtn.innerHTML = "جاري الإرسال..."; sBtn.disabled = true;
        const resultText = `الدرجة: ${correctCount}/${totalQs} | الصف: ${studentLevel} | المختبر: ${currentLab}`;
        const formData = new FormData();
        formData.append('entry.851707482', studentName);
        formData.append('entry.1149023992', resultText);
        try {
            await fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body: formData });
            sBtn.innerHTML = "تم الإرسال بنجاح ✅"; sBtn.style.background = "var(--green)";
            setTimeout(fetchData, 2000); 
        } catch (e) { alert("حدث خطأ في الإرسال"); sBtn.disabled = false; }
    }

    function generateReportImage() {
        document.getElementById('rep-school').innerText = schoolName;
        document.getElementById('rep-name').innerText = studentName;
        document.getElementById('rep-level').innerText = studentLevel;
        document.getElementById('rep-score').innerText = `النتيجة: ${correctCount} / ${totalQs}`;
        const list = document.getElementById('rep-questions-list'); list.innerHTML = "";
        userAnswers.forEach((item, i) => {
            list.innerHTML += `<div style="border-bottom:1px solid #333; padding:10px; text-align:right;"><b>${i+1}: ${item.q}</b><br>إجابتك: ${item.user} ${item.status ? '✅' : '❌'}</div>`;
        });
        html2canvas(document.getElementById('report-capture')).then(canvas => {
            const link = document.createElement('a');
            link.download = `نتيجة_${studentName}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    function sendWhatsApp() {
        if(!teacherPhone) return alert("رقم المعلم غير مسجل!");
        const msg = `أهلاً أستاذ، أنا الطالب: ${studentName}\nالصف: ${studentLevel}\nالمختبر: ${currentLab}\nالنتيجة: ${correctCount} من ${totalQs}`;
        window.open(`https://wa.me/${teacherPhone.replace(/\s+/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>
</body>
</html>
